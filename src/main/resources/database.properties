
spring.datasource.url=jdbc:mysql://localhost:3306/heimdall?useSSL=false&serverTimezone=UTC
spring.datasource.username=AgcBlue
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialects

# Connection pool (HikariCP - vine default cu Spring Boot)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2